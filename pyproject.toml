[project]
name = "tripagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.5",
    "pycountry>=26.2.16",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tavily-python>=0.8.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
tripagent = "tripagent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
